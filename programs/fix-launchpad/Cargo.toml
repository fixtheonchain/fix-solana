[package]
name = "fix-launchpad"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fix_launchpad"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Test-only CU probes; normal program and IDL builds do not enable this.
measure-mint-suffix = []

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["event-cpi"] }
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "token_2022"] }
spl-token-2022 = { version = "=6.0.0", features = ["no-entrypoint"] }
spl-token-metadata-interface = "=0.6.0"
uint = "=0.10.2"

[dev-dependencies]
litesvm = "=0.6.1"
solana-sdk = "=2.2.1"
serde_json = "1"
base64 = "=0.22.1"
bincode = "=1.3.3"

[target.'cfg(windows)'.dev-dependencies]
# LiteSVM's secp256r1 precompile needs OpenSSL; vendor it for reproducible Windows tests.
openssl = { version = "=0.10.81", features = ["vendored"] }
